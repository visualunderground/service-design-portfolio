name: Archive existing portfolio media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-media-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: public/media
          key: portfolio-media-v1-${{ hashFiles('src/images.json', 'scripts/import-media.mjs') }}
      - name: Download previously published media
        run: node scripts/import-media.mjs
      - name: Verify complete archive
        run: |
          node --input-type=module <<'JS'
          import { readFile, stat } from 'node:fs/promises';
          const images = JSON.parse(await readFile('src/images.json', 'utf8'));
          for (const name of Object.keys(images)) {
            const file = await stat('public/media/' + name);
            if (!file.isFile() || !file.size) throw Error('Empty or missing media: ' + name);
          }
          console.log('Verified ' + Object.keys(images).length + ' non-empty media files');
          JS
      - name: Commit media files to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/media
          if git diff --cached --quiet; then
            echo 'Media already archived'
            exit 0
          fi
          git commit -m 'Archive published portfolio media in repository'
          git pull --rebase origin main
          git push origin HEAD:main
