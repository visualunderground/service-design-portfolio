name: Recover public case-study media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-case-study-media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-case-study-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Recover matched public files
        run: python scripts/recover-case-study-media.py
      - name: Commit recovered files
        run: |
          if [ ! -d public/assets ]; then
            echo 'No additional assets recovered'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/assets
          if git diff --cached --quiet; then
            echo 'No new assets'
            exit 0
          fi
          git commit -m 'Archive recovered public case-study assets'
          git pull --rebase origin main
          git push origin HEAD:main
